[project]
name = "himena-relion-cryodrgn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "himena-relion>=0.0.17",  # accepts --pipeline_control appended by RELION
    "starfile-rs",
    "polars",
    "mrcfile",
    "numpy",
]

license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]


[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-qt",  # required by the pytest plugin bundled with himena
]
pyqt6 = [
    "himena-relion[pyqt6]",
]

[project.entry-points."himena.plugin"]
"RELION CryoDRGN" = "himena_relion_cryodrgn.main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--maxfail=5"]
